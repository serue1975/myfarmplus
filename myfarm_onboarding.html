<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이팜플러스 온보딩</title>
<style>
  :root{
    --primary:#1F69FF;
    --primary-08:#3A7CFF;
    --primary-bg:#EEF3FF;
    --green:#00B862;
    --text-01:#1D1F20;
    --text-02:#4A4F54;
    --text-hint:#888F95;
    --border:#EBEDEF;
    --bg:#F6F7F8;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
    background:#E2E4E8;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:48px 20px;
  }
  .phone{
    width:390px;height:844px;
    background:var(--white);
    border-radius:50px;
    box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #333,0 40px 80px rgba(0,0,0,.5);
    overflow:hidden;
    position:relative;
  }

  /* 스크린 */
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    transition:opacity .3s ease, transform .3s ease;
  }
  .screen.hidden{opacity:0;pointer-events:none;transform:translateX(24px);}
  .screen.slide-left{transform:translateX(-24px);opacity:0;pointer-events:none;}

  /* 상태바 */
  .status-bar{
    height:52px;padding:14px 28px 0;
    display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;
  }
  .status-time{font-size:15px;font-weight:700;color:var(--text-01);}
  .status-icons{display:flex;gap:6px;align-items:center;}

  /* ── STEP 0: 역할 선택 ── */
  #step-role .content{
    flex:1;display:flex;flex-direction:column;
    padding:32px 24px 40px;
  }
  .logo-area{
    display:flex;align-items:center;gap:10px;
    margin-bottom:40px;
  }
  .logo-icon{
    width:40px;height:40px;
    background:var(--primary);border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .logo-text{font-size:22px;font-weight:800;color:var(--primary);}
  .role-headline{
    font-size:26px;font-weight:800;
    color:var(--text-01);line-height:1.35;
    margin-bottom:8px;
  }
  .role-sub{
    font-size:15px;font-weight:400;
    color:var(--text-hint);margin-bottom:40px;
    line-height:1.6;
  }
  .role-cards{display:flex;flex-direction:column;gap:14px;flex:1;}
  .role-card{
    border:2px solid var(--border);
    border-radius:16px;padding:24px 20px;
    cursor:pointer;
    transition:border-color .2s, background .2s, transform .15s;
    display:flex;gap:16px;align-items:flex-start;
    -webkit-tap-highlight-color:transparent;
  }
  .role-card:active{transform:scale(.985);}
  .role-card.selected{
    border-color:var(--primary);
    background:var(--primary-bg);
  }
  .role-card-icon{
    width:48px;height:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-size:24px;
  }
  .role-card-icon.manager{background:#E8F0FF;}
  .role-card-icon.worker{background:#E6F9F1;}
  .role-card-body{}
  .role-card-title{
    font-size:18px;font-weight:700;
    color:var(--text-01);margin-bottom:6px;
  }
  .role-card-desc{
    font-size:13.5px;font-weight:400;
    color:var(--text-hint);line-height:1.55;
  }
  .role-card-tags{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-top:10px;
  }
  .tag{
    font-size:12px;font-weight:600;
    padding:3px 9px;border-radius:100px;
  }
  .tag-blue{background:var(--primary-bg);color:var(--primary);}
  .tag-green{background:#E6F9F1;color:var(--green);}

  .btn-role-next{
    margin-top:28px;
    width:100%;height:56px;
    background:var(--border);color:var(--text-hint);
    border:none;border-radius:12px;
    font-size:17px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:background .2s, color .2s;
  }
  .btn-role-next.active{background:var(--primary);color:#fff;}

  /* ── STEP 1~3: 슬라이드 가이드 ── */
  #step-guide .guide-header{
    padding:20px 24px 0;
    display:flex;justify-content:space-between;align-items:center;
    flex-shrink:0;
  }
  .guide-back{
    background:none;border:none;cursor:pointer;
    font-size:14px;font-weight:600;color:var(--text-hint);
    font-family:inherit;padding:4px 0;
  }
  .guide-skip{
    background:none;border:none;cursor:pointer;
    font-size:14px;font-weight:600;color:var(--text-hint);
    font-family:inherit;padding:4px 0;
  }

  /* 슬라이드 영역 */
  .slides-wrap{
    flex:1;overflow:hidden;position:relative;
  }
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    padding:24px 24px 0;
    transition:opacity .3s, transform .3s;
  }
  .slide.hidden{opacity:0;pointer-events:none;}
  .slide.from-right{transform:translateX(30px);opacity:0;pointer-events:none;}
  .slide.from-left{transform:translateX(-30px);opacity:0;pointer-events:none;}

  .slide-illust{
    width:100%;border-radius:16px;
    margin-bottom:28px;overflow:hidden;
    flex-shrink:0;
  }
  .illust-box{
    height:220px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    border-radius:16px;
    overflow:hidden;
  }

  /* 일러스트 - 관리자 */
  .illust-manager-1{background:linear-gradient(135deg,#EEF3FF 0%,#D6E4FF 100%);}
  .illust-manager-2{background:linear-gradient(135deg,#F0FFF8 0%,#C8F5E3 100%);}
  .illust-manager-3{background:linear-gradient(135deg,#FFF8EC 0%,#FFE4B0 100%);}
  /* 일러스트 - 작업자 */
  .illust-worker-1{background:linear-gradient(135deg,#F0FFF8 0%,#C8F5E3 100%);}
  .illust-worker-2{background:linear-gradient(135deg,#EEF3FF 0%,#D6E4FF 100%);}
  .illust-worker-3{background:linear-gradient(135deg,#FFF3F3 0%,#FFD6D6 100%);}

  .illust-inner{
    text-align:center;
  }
  .illust-emoji{font-size:72px;line-height:1;margin-bottom:8px;}
  .illust-caption{font-size:13px;font-weight:600;color:var(--text-hint);}

  .slide-step-label{
    font-size:12px;font-weight:700;
    color:var(--primary);letter-spacing:.5px;
    text-transform:uppercase;margin-bottom:8px;
  }
  .slide-title{
    font-size:22px;font-weight:800;
    color:var(--text-01);line-height:1.35;
    margin-bottom:10px;
  }
  .slide-desc{
    font-size:15px;font-weight:400;
    color:var(--text-02);line-height:1.7;
  }
  .slide-desc b{color:var(--text-01);font-weight:700;}

  .slide-tip{
    margin-top:16px;
    background:var(--bg);border-radius:10px;
    padding:12px 14px;
    display:flex;gap:8px;align-items:flex-start;
  }
  .slide-tip-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
  .slide-tip-text{font-size:13px;font-weight:500;color:var(--text-02);line-height:1.55;}

  /* 하단 네비 */
  .guide-bottom{
    padding:16px 24px 40px;
    flex-shrink:0;
  }
  .dots{
    display:flex;justify-content:center;gap:6px;
    margin-bottom:16px;
  }
  .dot{
    width:6px;height:6px;border-radius:3px;
    background:var(--border);transition:width .2s, background .2s;
  }
  .dot.active{width:20px;background:var(--primary);}

  .btn-next{
    width:100%;height:56px;
    background:var(--primary);color:#fff;
    border:none;border-radius:12px;
    font-size:17px;font-weight:700;font-family:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-next.green{background:var(--green);}

  /* ── STEP: 완료 ── */
  #step-done .content{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:32px 24px 60px;
    text-align:center;
  }
  .done-icon{
    width:80px;height:80px;border-radius:24px;
    background:var(--primary-bg);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;
    font-size:40px;
  }
  .done-title{
    font-size:24px;font-weight:800;
    color:var(--text-01);margin-bottom:10px;
    line-height:1.35;
  }
  .done-desc{
    font-size:15px;color:var(--text-hint);
    line-height:1.7;margin-bottom:40px;
  }
  .done-cta-label{
    font-size:13px;font-weight:600;color:var(--text-hint);
    margin-bottom:12px;
  }
  .btn-done{
    width:100%;height:56px;
    border:none;border-radius:12px;
    font-size:17px;font-weight:700;font-family:inherit;
    cursor:pointer;margin-bottom:12px;
  }
  .btn-done.primary{background:var(--primary);color:#fff;}
  .btn-done.secondary{
    background:var(--bg);color:var(--text-02);
    font-size:15px;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- ══ STEP 0: 역할 선택 ══ -->
  <div class="screen" id="step-role">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#1D1F20"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#1D1F20" stroke-width="1.5"><path d="M1 3.5C3.5 1 12.5 1 15 3.5M3.5 6C5.5 4 10.5 4 12.5 6M6 8.5C7 7.5 9 7.5 10 8.5"/><circle cx="8" cy="11" r="1" fill="#1D1F20" stroke="none"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#1D1F20" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1D1F20"/><path d="M23 4.5v3a1.5 1.5 0 000-3z" fill="#1D1F20" fill-opacity=".4"/></svg>
      </div>
    </div>
    <div class="content">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2C8 2 4 5 4 10c0 6 8 12 8 12s8-6 8-12c0-5-4-8-8-8z"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="none"/></svg>
        </div>
        <span class="logo-text">my Farm+</span>
      </div>
      <div class="role-headline">어떤 역할로<br>사용하시나요?</div>
      <div class="role-sub">역할에 맞는 화면과 기능을<br>바로 안내해 드릴게요.</div>

      <div class="role-cards">
        <div class="role-card" id="card-manager" onclick="selectRole('manager')">
          <div class="role-card-icon manager">🧑‍💼</div>
          <div class="role-card-body">
            <div class="role-card-title">관리자 · 법인 대표</div>
            <div class="role-card-desc">작업을 계획하고 필지·작업자를<br>관리하는 역할이에요.</div>
            <div class="role-card-tags">
              <span class="tag tag-blue">작업그룹 관리</span>
              <span class="tag tag-blue">필지 등록</span>
              <span class="tag tag-blue">실적 확인</span>
            </div>
          </div>
        </div>
        <div class="role-card" id="card-worker" onclick="selectRole('worker')">
          <div class="role-card-icon worker">🚜</div>
          <div class="role-card-body">
            <div class="role-card-title">작업자 · 현장 인력</div>
            <div class="role-card-desc">현장에서 작업을 수행하고<br>완료 처리하는 역할이에요.</div>
            <div class="role-card-tags">
              <span class="tag tag-green">오늘 작업 확인</span>
              <span class="tag tag-green">필지 찾기</span>
              <span class="tag tag-green">작업 완료</span>
            </div>
          </div>
        </div>
      </div>

      <button class="btn-role-next" id="btnRoleNext" onclick="goGuide()" disabled>
        시작하기 →
      </button>
    </div>
  </div>

  <!-- ══ STEP 1~3: 슬라이드 가이드 ══ -->
  <div class="screen hidden" id="step-guide">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#1D1F20"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#1D1F20" stroke-width="1.5"><path d="M1 3.5C3.5 1 12.5 1 15 3.5M3.5 6C5.5 4 10.5 4 12.5 6M6 8.5C7 7.5 9 7.5 10 8.5"/><circle cx="8" cy="11" r="1" fill="#1D1F20" stroke="none"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#1D1F20" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1D1F20"/><path d="M23 4.5v3a1.5 1.5 0 000-3z" fill="#1D1F20" fill-opacity=".4"/></svg>
      </div>
    </div>
    <div class="guide-header">
      <button class="guide-back" onclick="goBack()">← 역할 변경</button>
      <button class="guide-skip" onclick="goToAction()">건너뛰기</button>
    </div>

    <div class="slides-wrap" id="slidesWrap">
      <!-- 슬라이드는 JS로 렌더 -->
    </div>

    <div class="guide-bottom">
      <div class="dots" id="dots"></div>
      <button class="btn-next" id="btnNext" onclick="nextSlide()">다음</button>
    </div>
  </div>

  <!-- ══ STEP DONE: 첫 액션 유도 ══ -->
  <div class="screen hidden" id="step-done">
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#1D1F20"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#1D1F20" stroke-width="1.5"><path d="M1 3.5C3.5 1 12.5 1 15 3.5M3.5 6C5.5 4 10.5 4 12.5 6M6 8.5C7 7.5 9 7.5 10 8.5"/><circle cx="8" cy="11" r="1" fill="#1D1F20" stroke="none"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#1D1F20" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#1D1F20"/><path d="M23 4.5v3a1.5 1.5 0 000-3z" fill="#1D1F20" fill-opacity=".4"/></svg>
      </div>
    </div>
    <div class="content" id="doneContent"></div>
  </div>

</div>

<script>
let selectedRole = null;
let currentSlide = 0;

const slides = {
  manager: [
    {
      illust: 'illust-manager-1',
      emoji: '📋',
      caption: '작업그룹 = 이번 시즌 프로젝트',
      label: '첫 번째',
      title: '작업그룹으로\n시즌을 시작하세요',
      desc: '<b>작업그룹</b>은 이번 시즌의 작업 묶음이에요. 홈 화면 상단 아이콘에서 작업 종류를 고르면 바로 만들 수 있어요.',
      tip: { icon: '💡', text: '예: "2026 논 작업", "2026 방제 시즌" 처럼 연도+작업 종류로 이름 짓는 게 나중에 찾기 편해요.' }
    },
    {
      illust: 'illust-manager-2',
      emoji: '🗺️',
      caption: '필지그룹 = 작업할 땅의 묶음',
      label: '두 번째',
      title: '필지그룹으로\n작업 땅을 연결하세요',
      desc: '<b>필지그룹</b>은 작업할 논·밭을 미리 묶어두는 폴더예요. 작업그룹과 연결하면 작업자들이 지도에서 바로 확인할 수 있어요.',
      tip: { icon: '📍', text: '필지그룹을 미리 등록해두면 매 시즌 재사용할 수 있어서 편해요.' }
    },
    {
      illust: 'illust-manager-3',
      emoji: '🎨',
      caption: '작업 컬러 = 지도의 공정 신호',
      label: '세 번째',
      title: '컬러로 공정을\n한눈에 관리하세요',
      desc: '각 <b>작업명에 컬러</b>를 지정하면 지도에서 필지가 해당 색으로 표시돼요. 작업자들이 어느 필지가 어떤 공정인지 색만 보고 바로 알 수 있어요.',
      tip: { icon: '🚜', text: '예: 로터리(보라) 완료 → 써레질 작업자가 보라색 필지를 찾아가서 작업.' }
    }
  ],
  worker: [
    {
      illust: 'illust-worker-1',
      emoji: '🏠',
      caption: '홈 = 오늘 내 작업 출발점',
      label: '첫 번째',
      title: '홈에서 오늘 작업을\n확인하세요',
      desc: '홈 화면 <b>"나의 진행 작업"</b>에서 내가 맡은 작업과 진행률을 바로 확인할 수 있어요. 여기서 시작하면 돼요.',
      tip: { icon: '💡', text: '관리자가 작업을 배정하면 자동으로 내 홈에 나타나요. 따로 설정할 것 없어요.' }
    },
    {
      illust: 'illust-worker-2',
      emoji: '🗺️',
      caption: '지도 컬러 = 내가 할 공정',
      label: '두 번째',
      title: '지도에서 내 색깔\n필지를 찾으세요',
      desc: '각 작업은 <b>고유한 컬러</b>를 가져요. 지도에서 내 작업 컬러의 필지를 찾아가서 작업하면 돼요. 필지를 터치하면 상세 정보를 볼 수 있어요.',
      tip: { icon: '🎨', text: '예: 써레질 담당이라면 로터리(보라색) 완료된 필지를 찾아가면 돼요.' }
    },
    {
      illust: 'illust-worker-3',
      emoji: '✅',
      caption: '완료 처리 = 다음 공정 신호',
      label: '세 번째',
      title: '작업 완료 후\n꼭 완료 처리하세요',
      desc: '작업이 끝나면 <b>완료 처리</b>를 해야 해요. 그래야 다음 공정 작업자가 이 필지로 진행할 수 있어요. 필지 색이 바뀌면서 완료가 표시돼요.',
      tip: { icon: '⚠️', text: '완료 처리 안 하면 다음 공정이 시작이 안 돼요. 작업 끝나면 꼭 눌러주세요!' }
    }
  ]
};

const doneContent = {
  manager: {
    icon: '📋',
    iconBg: '#EEF3FF',
    title: '준비됐어요!\n지금 바로 시작해볼까요?',
    desc: '첫 작업그룹을 만들고\n필지와 작업을 등록해보세요.',
    primaryLabel: '작업그룹 만들기 →',
    secondaryLabel: '일단 홈으로 가기',
    tertiaryLabel: '가이드 다시 보기',
    primaryClass: 'primary'
  },
  worker: {
    icon: '🚜',
    iconBg: '#E6F9F1',
    title: '준비됐어요!\n오늘 작업을 확인해보세요.',
    desc: '홈에서 배정된 작업을 확인하고\n지도에서 내 필지를 찾아가세요.',
    primaryLabel: '홈으로 가기 →',
    secondaryLabel: '가이드 다시 보기',
    primaryClass: 'primary'
  }
};

function selectRole(role) {
  selectedRole = role;
  document.getElementById('card-manager').classList.toggle('selected', role === 'manager');
  document.getElementById('card-worker').classList.toggle('selected', role === 'worker');
  const btn = document.getElementById('btnRoleNext');
  btn.classList.add('active');
  btn.disabled = false;
}

function goGuide() {
  if (!selectedRole) return;
  currentSlide = 0;
  renderSlides();
  // 모든 화면 숨기고 guide만 표시
  ['step-role','step-done'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.add('hidden');
    el.classList.remove('exit','slide-left');
  });
  const guide = document.getElementById('step-guide');
  guide.classList.remove('hidden','exit','slide-left');
}

function goBack() {
  const guide = document.getElementById('step-guide');
  const role = document.getElementById('step-role');
  guide.classList.add('hidden');
  role.classList.remove('hidden','exit','slide-left');
}

function goToAction() {
  renderDone();
  const guide = document.getElementById('step-guide');
  const done = document.getElementById('step-done');
  guide.classList.add('exit');
  setTimeout(() => {
    guide.classList.add('hidden');
    guide.classList.remove('exit');
    done.classList.remove('hidden','exit');
  }, 250);
}

function goToStart() {
  // 처음(역할선택)으로 리셋
  selectedRole = null;
  document.getElementById('card-manager').classList.remove('selected');
  document.getElementById('card-worker').classList.remove('selected');
  const btn = document.getElementById('btnRoleNext');
  btn.classList.remove('active');
  btn.disabled = true;

  ['step-guide','step-done'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  const role = document.getElementById('step-role');
  role.classList.remove('hidden','exit','slide-left');
}

function renderSlides() {
  const wrap = document.getElementById('slidesWrap');
  const list = slides[selectedRole];
  wrap.innerHTML = '';
  list.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? '' : ' hidden');
    el.id = 'slide-' + i;
    el.innerHTML = `
      <div class="slide-illust">
        <div class="illust-box ${s.illust}">
          <div class="illust-inner">
            <div class="illust-emoji">${s.emoji}</div>
            <div class="illust-caption">${s.caption}</div>
          </div>
        </div>
      </div>
      <div class="slide-step-label">${s.label}</div>
      <div class="slide-title">${s.title.replace('\n','<br>')}</div>
      <div class="slide-desc">${s.desc}</div>
      <div class="slide-tip">
        <span class="slide-tip-icon">${s.tip.icon}</span>
        <span class="slide-tip-text">${s.tip.text}</span>
      </div>
    `;
    wrap.appendChild(el);
  });
  updateDots();
  updateNextBtn();
}

function updateDots() {
  const list = slides[selectedRole];
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  list.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentSlide ? ' active' : '');
    dots.appendChild(d);
  });
}

function updateNextBtn() {
  const btn = document.getElementById('btnNext');
  const list = slides[selectedRole];
  const isLast = currentSlide === list.length - 1;
  btn.textContent = isLast ? '시작하기 🎉' : '다음';
  btn.className = 'btn-next' + (isLast && selectedRole === 'worker' ? ' green' : '');
}

function nextSlide() {
  const list = slides[selectedRole];
  if (currentSlide < list.length - 1) {
    const cur = document.getElementById('slide-' + currentSlide);
    cur.classList.add('from-left');
    setTimeout(() => cur.classList.add('hidden'), 250);
    currentSlide++;
    const next = document.getElementById('slide-' + currentSlide);
    next.classList.remove('hidden');
    next.style.transform = 'translateX(30px)';
    next.style.opacity = '0';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        next.style.transition = 'opacity .3s, transform .3s';
        next.style.transform = '';
        next.style.opacity = '';
      });
    });
    updateDots();
    updateNextBtn();
  } else {
    goToAction();
  }
}

function renderDone() {
  const d = doneContent[selectedRole];
  const el = document.getElementById('doneContent');
  const isManager = selectedRole === 'manager';
  el.innerHTML = `
    <div class="done-icon" style="background:${d.iconBg}">${d.icon}</div>
    <div class="done-title">${d.title.replace('\n','<br>')}</div>
    <div class="done-desc">${d.desc.replace('\n','<br>')}</div>
    <div style="width:100%">
      <div class="done-cta-label">무엇부터 시작할까요?</div>
      <button class="btn-done ${d.primaryClass}">${d.primaryLabel}</button>
      <button class="btn-done secondary">${d.secondaryLabel}</button>
      ${isManager ? `<button class="btn-done secondary" style="margin-top:0;color:var(--text-hint);font-size:14px;background:none;" onclick="goToStart()">${d.tertiaryLabel}</button>` : `<button class="btn-done secondary" style="margin-top:0;color:var(--text-hint);font-size:14px;background:none;" onclick="goToStart()">${d.secondaryLabel}</button>`}
    </div>
  `;
}

function transition(from, to, reverse = false) {
  const fromEl = document.getElementById(from);
  const toEl = document.getElementById(to);
  fromEl.classList.add('exit');
  setTimeout(() => {
    fromEl.classList.add('hidden');
    fromEl.classList.remove('exit','slide-left');
    toEl.classList.remove('hidden','exit','slide-left');
  }, 250);
}
</script>
</body>
</html>
