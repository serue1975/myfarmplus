<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>내 장비 시세 Prototype</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue-09:#1F69FF; --blue-07:#2F6BE0; --blue-05:#7FA8FF; --blue-03:#D6E4FF; --blue-02:#EAF1FF;
  --gray-01:#F9FAFB; --gray-03:#F1F2F4; --gray-04:#EBEDEF; --gray-05:#E3E5E8; --gray-06:#D0D4D7;
  --gray-08:#A0A6AC; --gray-09:#888F95; --gray-10:#6D7379; --gray-12:#464A4E; --gray-15:#1D1F20;
  --red:#E5383B;
}
html,body{height:100%;font-family:'Pretendard',sans-serif;background:#F6F7F8;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;cursor:pointer}

.phone{width:390px;height:844px;background:#fff;border-radius:44px;box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #2a2a2a,0 32px 80px rgba(0,0,0,.5);overflow:hidden;position:relative}
@media (max-width: 450px) {
  html, body { background:#fff; align-items:flex-start; justify-content:flex-start; }
  .phone { width:100vw !important; height:100vh !important; height:100dvh !important; border-radius:0 !important; box-shadow:none !important; }
  .ctrl { display:none !important; }
}

/* 상태바: 허브(풀블리드)에서는 투명, 스크롤/단계 화면에서는 흰색 */
.status-bar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 21px 0 19px;z-index:60;background:transparent;transition:background .2s ease}
.phone.sb-white .status-bar{background:#fff}
.status-time{font-size:15px;font-weight:600;color:var(--gray-15);letter-spacing:-0.5px}
.status-icons{display:flex;align-items:center;gap:6px}

/* 데스크톱 컨트롤 */
.ctrl{position:fixed;left:24px;top:24px;width:190px;display:flex;flex-direction:column;gap:8px}
.ctrl .lbl{font-size:11px;font-weight:700;color:var(--gray-09);letter-spacing:.04em;margin-top:6px}
.ctrl .lbl:first-child{margin-top:0}
.ctrl button{appearance:none;border:1px solid var(--gray-06);background:#fff;color:var(--gray-12);font-size:13px;font-weight:600;padding:9px 14px;border-radius:8px;text-align:left}
.ctrl .where{border:1px solid var(--gray-04);background:#fff;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--gray-10);line-height:1.6}
.ctrl .where b{display:block;font-size:13px;color:var(--gray-15)}
.ctrl .note{font-size:11px;color:var(--gray-09);line-height:1.5}

/* 패널(화면) 스택 */
.pane{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;transition:transform .34s cubic-bezier(.32,.72,0,1),filter .34s ease;will-change:transform;z-index:10;overflow:hidden}
.pane.right{transform:translateX(100%);pointer-events:none}
.pane.center{transform:none;z-index:12}
.pane.left{transform:translateX(-28%);filter:brightness(.96);pointer-events:none}
.pane.nt{transition:none}

/* ───── 첫 화면(허브) — Figma "내 장비시세 메인" 기준 ───── */
.hbar{position:absolute;top:44px;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;gap:8px;padding:0 20px 0 16px;transition:background .2s ease,box-shadow .2s ease}
.hbar.solid{background:#fff;box-shadow:0 1px 0 var(--gray-04)}
.hbar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:none;flex-shrink:0}
.hbar .title{font-weight:700;font-size:18px;letter-spacing:-0.36px;color:#000;line-height:1.3}
.hscroll{position:absolute;inset:0;overflow-y:auto;padding-bottom:120px;-webkit-overflow-scrolling:touch}

.hero2{position:relative;height:384px;background:#fff;overflow:hidden}
.hero2 .in{position:relative;padding:116px 20px 0}
.hero2 .tag{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--blue-09);letter-spacing:-0.26px;line-height:1.3}
.hero2 h1{margin-top:10px;font-size:28px;font-weight:400;color:var(--gray-15);letter-spacing:-0.56px;line-height:1.2}
.hero2 h1 b{display:block;font-weight:700}
.loadcard{margin-top:68px;display:flex;align-items:center;justify-content:space-between;width:100%;height:64px;background:#fff;border:none;border-radius:8px;padding:0 10px 0 16px;box-shadow:0 8px 8px rgba(0,48,146,.06);text-align:left}
.loadcard:active{background:var(--gray-01)}
.loadcard .l{display:flex;align-items:center;gap:12px}
.loadcard .ic{width:44px;height:44px;border-radius:50%;background:#EEF4FF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loadcard b{font-size:18px;font-weight:700;color:var(--blue-09);letter-spacing:-0.36px;line-height:1.3}

.hsec{padding:0 20px 24px}
.hsec h2{font-size:17px;font-weight:700;color:var(--gray-15);letter-spacing:-0.34px;line-height:1.3}
.hsec .sub{margin-top:2px;font-size:13px;font-weight:500;color:var(--gray-08);letter-spacing:-0.26px;line-height:1.3}
.types{display:flex;gap:8px;margin-top:8px}
.tp{flex:1;min-width:0;border:none;border-radius:6px;background:#F6F7F8;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 16px;font-size:15px;font-weight:600;color:#383B3E;letter-spacing:-0.3px;line-height:1.3;transition:background .12s ease,box-shadow .12s ease,transform .08s ease}
.tp:active{transform:scale(.97)}
.tp .pic{width:72px;height:72px}
.tp .pic img{display:block;width:100%;height:100%}
.tp.sel{background:#EEF4FF;box-shadow:inset 0 0 0 1px var(--blue-09)}

.hub-note{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:20px;z-index:14}
.hub-note .bx{background:#F6F7F8;border-radius:12px;padding:12px 20px}
.hub-note .hd{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#464A4E;letter-spacing:-0.28px;line-height:1.3}
.hub-note ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:500;color:var(--gray-09);letter-spacing:-0.26px;line-height:1.3;white-space:nowrap}

.fields{position:relative;margin-top:-0.8px;padding:0 20px 0;display:flex;flex-direction:column;gap:18px}
.f .fl{font-size:14px;font-weight:700;color:var(--gray-15);letter-spacing:-0.28px;margin-bottom:8px}
.fv{width:100%;height:52px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--gray-04);background:var(--gray-01);border-radius:10px;padding:0 14px;font-size:15px;color:var(--gray-15);font-weight:500;letter-spacing:-0.3px;text-align:left}
.fv.empty{color:var(--gray-08);font-weight:400}
.fv.dis{background:var(--gray-03);color:var(--gray-08);cursor:not-allowed}
.fv:active{background:var(--gray-03)}
.fv .unit{color:var(--gray-10);font-weight:500}

.hub-cta{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 24px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 30%);z-index:15}

.cta{width:100%;height:54px;border:none;border-radius:12px;background:var(--blue-09);color:#fff;font-size:17px;font-weight:700;letter-spacing:-0.34px;transition:transform .08s ease,background .12s ease}
.cta:active{transform:scale(.985);background:#1a5ae0}
.cta:disabled{background:var(--gray-05);color:var(--gray-08);cursor:default;transform:none}

/* 입력 정보 확인(요약) */
.sum-h{font-size:18px;font-weight:800;color:var(--gray-15);letter-spacing:-0.04em}
.sumcard{margin-top:-6px;border:1px solid var(--gray-04);border-radius:16px;background:#fff;padding:0 4px 0 16px}
.srow{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;border:none;border-bottom:1px solid var(--gray-04);background:none;text-align:left;padding:0 10px 0 0}
.srow:last-child{border-bottom:none}
.srow .sl{width:78px;flex-shrink:0;font-size:14px;color:var(--gray-10);letter-spacing:-0.28px}
.srow .sv{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:16px;font-weight:700;color:var(--gray-15);letter-spacing:-0.32px;text-align:right}
.srow .sv .th{width:40px;height:32px;display:flex;align-items:center;justify-content:center}
.srow .sv .th img{width:100%;height:100%;object-fit:contain;display:block}
.srow .sv .u{font-weight:500;color:var(--gray-10)}
.sum-note{margin-top:-8px;font-size:12px;color:var(--gray-09);letter-spacing:-0.24px;padding:0 4px}
/* ───── 단계 화면 ───── */
.s-top{display:flex;align-items:center;justify-content:space-between;height:56px;margin-top:44px;padding:12px 20px 12px 16px;flex-shrink:0}
.s-top .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:none;margin:0}
.s-top .count{font-size:16px;font-weight:500;color:#6D7379;letter-spacing:-0.32px;font-variant-numeric:tabular-nums}
.s-body{flex:1;overflow-y:auto;padding:12px 20px 16px;-webkit-overflow-scrolling:touch}
.s-body h1{font-size:22px;font-weight:700;color:#1D1F20;letter-spacing:-0.44px;line-height:1.3;padding-bottom:28px}
.ctx{display:flex;align-items:center;gap:6px;height:20px;margin-bottom:8px;font-size:13px;font-weight:500;color:#464A4E;letter-spacing:-0.26px}
.ctx i{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:800;font-style:italic;letter-spacing:-0.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:170px;height:30px;padding:0 11px;border:none;border-radius:15px;background:var(--gray-03);color:var(--gray-12);font-size:13px;font-weight:600;letter-spacing:-0.26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:active{background:var(--gray-05)}
.chip .x{color:var(--gray-09);font-weight:500;font-size:11px}
.s-foot{padding:10px 20px 24px;flex-shrink:0;background:#fff}

.search{display:flex;align-items:center;justify-content:space-between;height:48px;border:1px solid #E3E5E8;border-radius:6px;padding:8px 14px;margin:0 0 20px;background:#F9FAFB}
.search:focus-within{border-color:var(--blue-09)}
.search input{flex:1;min-width:0;border:none;outline:none;background:none;font-family:inherit;font-size:17px;letter-spacing:-0.34px;color:#1D1F20}
.search input::placeholder{color:#A0A6AC}
.li{display:flex;align-items:center;gap:12px;width:100%;height:72px;padding:16px;margin-bottom:8px;border:1px solid #EBEDEF;border-radius:8px;background:#fff;font-size:16px;font-weight:700;color:#383B3E;letter-spacing:-0.32px;text-align:left;transition:background .08s ease}
.li.sm{height:54px;padding:0 20px;font-weight:600;color:#464A4E}
.li:active{background:var(--gray-03)}
.li.sel{border-color:var(--blue-09);background:#EEF4FF}
.li .logo{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;flex-shrink:0;letter-spacing:-0.02em}
.li .pen{width:40px;height:40px;border-radius:50%;background:#D0D4D7;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li .ck{display:none}
.li.direct{color:#464A4E;font-weight:600;gap:12px}
.li.direct .dl{display:flex;align-items:center;gap:2px}
.empty-box{text-align:center;padding:36px 12px;color:var(--gray-10);font-size:13px;line-height:1.6;letter-spacing:-0.26px}

.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.yb{height:48px;border:1px solid #EBEDEF;border-radius:8px;background:#fff;font-size:16px;font-weight:600;color:#464A4E;letter-spacing:-0.32px;font-variant-numeric:tabular-nums;transition:background .08s ease}
.yb:active{background:var(--gray-03)}
.yb.sel{border-color:var(--blue-09);background:#EEF4FF}

.h-wrap{position:relative;margin-top:36px}
.h-in{width:100%;border:none;border-bottom:2px solid var(--gray-06);outline:none;background:none;font-family:inherit;font-size:36px;font-weight:700;letter-spacing:-0.72px;color:var(--gray-15);padding:6px 70px 10px 0;font-variant-numeric:tabular-nums;border-radius:0}
.h-in:focus{border-bottom-color:var(--blue-09)}
.h-in::placeholder{color:var(--gray-06)}
.h-unit{position:absolute;right:2px;bottom:14px;font-size:20px;font-weight:600;color:var(--gray-10)}
.h-err{min-height:18px;margin-top:8px;font-size:12px;color:var(--red);letter-spacing:-0.24px}
.h-help{margin-top:4px;font-size:13px;color:var(--gray-10);letter-spacing:-0.26px}
.h-help b{color:var(--gray-15);font-weight:700}

/* 시트 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:70}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:10px 20px 24px;z-index:80;transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--gray-06);margin:0 auto 16px}
.sheet h3{font-size:18px;font-weight:800;color:var(--gray-15);letter-spacing:-0.04em}
.sheet .sub{margin-top:4px;font-size:13px;color:var(--gray-10);letter-spacing:-0.26px}
.sheet .inp{display:block;width:100%;height:52px;margin:16px 0 14px;padding:0 14px;border:1px solid var(--gray-05);border-radius:10px;background:var(--gray-01);font-family:inherit;font-size:15px;color:var(--gray-15);outline:none}
.sheet .inp:focus{border-color:var(--blue-09);background:#fff}
.eq{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-top:10px;border:1px solid var(--gray-04);border-radius:14px;background:#fff;text-align:left}
.eq.sel{border-color:var(--blue-09);background:var(--blue-02)}
.eq .pic{width:56px;height:44px;border-radius:10px;background:var(--gray-03);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.eq.sel .pic{background:#fff}
.eq .pic img{width:44px;height:44px;object-fit:contain;display:block}
.eq .tx b{display:block;font-size:15px;font-weight:700;color:var(--gray-15);letter-spacing:-0.3px}
.eq .tx span{display:block;margin-top:2px;font-size:12px;color:var(--gray-10);letter-spacing:-0.24px}
.eq .rd{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--gray-06);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.eq.sel .rd{border-color:var(--blue-09);background:var(--blue-09)}
.eq.sel .rd::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sheet .cta{margin-top:16px}

.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%) translateY(10px);background:rgba(29,31,32,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s ease,transform .25s ease;z-index:90;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ───── 등록 시트 ───── */
.scrim.dim6{background:rgba(0,0,0,.6)}
.sheet.reg{padding:0 0 8px;border-radius:20px 20px 0 0}
.sheet.reg .rgrab{height:22px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
.sheet.reg .rgrab i{display:block;width:32px;height:3px;border-radius:10px;background:#A0A6AC}
.sheet.reg .rb{display:flex;flex-direction:column;align-items:center;padding:0 20px;margin-top:-10px}
.sheet.reg .rimg{width:200px;height:110px;display:flex;align-items:center;justify-content:center}
.sheet.reg .rimg img{width:128px;height:auto;display:block;mix-blend-mode:multiply}
.sheet.reg h3{margin-top:12px;font-size:22px;font-weight:700;color:#1D1F20;letter-spacing:-0.44px;line-height:1.3;text-align:center}
.sheet.reg .rp{margin-top:8px;padding-bottom:4px;font-size:14px;font-weight:500;color:#888F95;letter-spacing:-0.28px;line-height:1.3;text-align:center}
.sheet.reg .rbtn{padding:24px 20px 0}
.cta2{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border:none;border-radius:6px;background:#1F69FF;color:#fff;font-size:18px;font-weight:700;letter-spacing:-0.36px;transition:transform .08s ease,background .08s ease}
.cta2:active{transform:scale(.985);background:#1a5ae0}
.skip{display:flex;align-items:center;justify-content:center;width:100%;height:48px;padding:6px 0;border:none;background:none;font-size:13px;font-weight:600;color:#A0A6AC;letter-spacing:-0.26px;text-decoration:underline;text-underline-offset:2px}

/* ───── 로딩 ───── */
.ld{background:#fff}
.ld-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ld-bg img{display:block;width:100%;height:100%;object-fit:cover;object-position:center bottom;transform-origin:50% 100%;animation:ldfloat 6s ease-in-out infinite alternate}
@keyframes ldfloat{from{transform:scale(1)}to{transform:scale(1.025)}}
.ld-c{position:absolute;left:0;right:0;top:284px;display:flex;flex-direction:column;align-items:center;gap:16px}
.orb2{position:relative;width:108px;height:108px;border-radius:50%;border:1px solid rgba(0,51,154,.05);display:flex;align-items:center;justify-content:center}
.orb2 .glow{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(31,105,255,.22) 0,rgba(31,105,255,.08) 55%,rgba(31,105,255,0) 72%);animation:glowp 2.4s ease-in-out infinite}
@keyframes glowp{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.orb2 .rp{position:absolute;inset:14px;border-radius:50%;border:1.5px solid rgba(31,105,255,.45);opacity:0;animation:ripple 2.4s ease-out infinite}
.orb2 .rp2{animation-delay:1.2s}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.75);opacity:0}}
.orb2 .arc{position:absolute;inset:8px;border-radius:50%;background:conic-gradient(from 0deg,rgba(31,105,255,0) 0,rgba(31,105,255,0) 45%,rgba(31,105,255,.95) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:spin 1.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb2 .oc{position:relative;width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid #E4EDFF;box-shadow:0 0 20px rgba(31,105,255,.24);display:flex;align-items:center;justify-content:center;animation:breathe 1.8s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(.96)}to{transform:scale(1.03)}}
.orb2 .oc svg{width:42px;height:42px;overflow:visible;animation:starspin 3s cubic-bezier(.6,0,.3,1) infinite}
@keyframes starspin{0%{transform:rotate(0) scale(1)}45%{transform:rotate(180deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}
.orb2 .oc .sm{transform-origin:31.5px 10.5px;animation:twk 1.5s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.55}}
.ld-c p{font-size:15px;font-weight:700;color:#1F69FF;letter-spacing:-0.3px;line-height:1.3}

/* ───── 결과 (Figma 최종 AI시세) ───── */
.rs{background:#fff}
.rscroll{position:absolute;inset:0;overflow-y:auto;padding:112px 0 170px;-webkit-overflow-scrolling:touch}
.rtr{position:absolute;left:233px;top:60px;width:169px;height:auto;display:block;z-index:3;pointer-events:none;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .5s ease .1s,transform .6s cubic-bezier(.22,1,.36,1) .1s}
.rs.go .rtr{opacity:1;transform:none}
.rhd{padding:0 20px 16px}
.rhd .tags{display:flex;gap:4px;align-items:center}
.rhd .t1{display:flex;align-items:center;height:22px;padding:2px 8px;border-radius:6px;background:#EEF4FF;color:#1F69FF;font-size:13px;font-weight:700;letter-spacing:-0.26px}
.rhd .t2{display:flex;align-items:center;height:22px;padding:2px 6px;border-radius:6px;background:#F1F2F4;color:#6D7379;font-size:12px;font-weight:700;letter-spacing:-0.24px}
.rhd h1{margin-top:8px;font-size:26px;font-weight:700;color:#1D1F20;letter-spacing:-0.52px;line-height:1.3}
.rbody{padding:0 20px;display:flex;flex-direction:column;gap:12px}
.pc{background:#EEF4FF;border-radius:12px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.pc .lb{font-size:13px;font-weight:700;color:#1F69FF;letter-spacing:-0.26px;line-height:1.3}
.pc .pr{display:flex;align-items:center;gap:4px;margin-top:2px;color:#004FEE;white-space:nowrap}
.pc .pr b{font-size:36px;font-weight:800;letter-spacing:-0.72px;line-height:1.3;font-variant-numeric:tabular-nums}
.pc .pr span{align-self:flex-end;height:28px;font-size:18px;font-weight:600;letter-spacing:-0.36px;line-height:1.3;display:flex;align-items:flex-end}
.pc .sb{margin-top:4px;font-size:13px;font-weight:500;color:#888F95;letter-spacing:-0.26px;line-height:1.3}
.pc .sl{position:relative;height:20px;margin-bottom:-8px}
.pc .sl .tr{position:absolute;left:0;right:0;top:6px;height:8px;border-radius:4px;background:#CFDFFF}
.pc .sl .rg{position:absolute;top:6px;height:8px;left:50%;right:50%;border-radius:4px;background:linear-gradient(90deg,#4F89FF,#1F69FF);transition:left 1s cubic-bezier(.22,1,.36,1) .15s,right 1s cubic-bezier(.22,1,.36,1) .15s}
.pc .sl .hd{position:absolute;top:0;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;border:3px solid #1F69FF;box-shadow:0 2px 6px rgba(31,105,255,.3);left:50%;opacity:0;transition:left 1s cubic-bezier(.22,1,.36,1) .15s,opacity .3s ease .1s}
.pc .sl.go .rg{left:7.1%;right:7.1%}
.pc .sl.go .h1{left:7.1%;opacity:1}
.pc .sl.go .h2{left:92.9%;opacity:1}
.pc .mm{display:flex;justify-content:space-between;padding:0 8px;line-height:1.3}
.pc .mm div:last-child{text-align:right}
.pc .mm small{display:block;font-size:13px;font-weight:500;color:#6D7379;letter-spacing:-0.26px}
.pc .mm b{display:block;font-size:16px;font-weight:700;color:#292B2D;letter-spacing:-0.32px;font-variant-numeric:tabular-nums}
.ic{background:#fff;border:1px solid #EBEDEF;border-radius:12px;padding:12px 0 8px;overflow:hidden}
.ic .ich{display:flex;align-items:center;justify-content:space-between;width:100%;height:35px;padding:0 12px 10px 16px;border:none;border-bottom:1px solid #EBEDEF;background:none;text-align:left;font-size:15px;font-weight:700;color:#1D1F20;letter-spacing:-0.3px}
.ic .ich svg{transition:transform .25s ease}
.ic.closed .ich svg{transform:rotate(180deg)}
.ic .icsum{display:none;gap:4px;padding:10px 16px 4px}
.ic.closed .icsum{display:flex}
.ic .icsum span{display:flex;align-items:center;height:22px;padding:2px 8px;border-radius:6px;background:#F1F2F4;color:#6D7379;font-size:12px;font-weight:700;letter-spacing:-0.24px}
.ic .icw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
.ic.closed .icw{grid-template-rows:0fr}
.ic .icb{overflow:hidden;min-height:0}
.ic .icb>div{padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.ic .ir{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid #EBEDEF}
.ic .ir:last-child{border-bottom:none}
.ic .ir span{font-size:13px;font-weight:600;color:#888F95;letter-spacing:-0.26px;line-height:1.3}
.ic .ir b{font-size:15px;font-weight:700;color:#383B3E;letter-spacing:-0.3px;line-height:1.3;text-align:right}
.nb{background:#F6F7F8;border:1px solid #EBEDEF;border-radius:12px;padding:12px 20px 8px}
.nb .h{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#464A4E;letter-spacing:-0.28px;line-height:1.3}
.nb .d{white-space:nowrap;margin-top:4px;padding-left:26px;font-size:13px;font-weight:500;color:#888F95;letter-spacing:-0.26px;line-height:1.3}
.rbar{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:16px 20px 8px;z-index:20}
.rbar .bub,.rbar .rtoast{position:absolute;left:50%;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease}
.rbar .bub{top:-30px;width:280px;height:32px;margin-left:-140px;transform:translateY(6px);display:flex;align-items:center;justify-content:center;border-radius:8px;background:#1D1F20;color:#F1F2F4;font-size:14px;font-weight:600;letter-spacing:-0.28px;white-space:nowrap;filter:drop-shadow(0 4px 4px rgba(0,0,0,.16))}
.rbar .bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top:8px solid #1D1F20}
.rbar .bub.on{opacity:1;transform:none}
.rbar .rtoast{top:-36px;width:312px;height:44px;margin-left:-156px;transform:translateY(8px);display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:#1D1F20;color:#fff;font-size:15px;font-weight:600;letter-spacing:-0.3px;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.rbar .rtoast.on{opacity:1;transform:none}
/* 스크롤바 숨김 — 접고 펼 때 폭 변화로 덜컥거리지 않게 */
.rscroll,.hscroll,.s-body,.sheet{scrollbar-width:none;-ms-overflow-style:none}
.rscroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.s-body::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}
.ic .ich:focus{outline:none}.ic .ich:focus-visible{outline:2px solid #1F69FF;outline-offset:-2px}

/* ═════════ v3 — 최종 정리안 ═════════ */
.status-time{transition:color .2s ease}
.status-icons svg *{transition:fill .2s ease,stroke .2s ease}
.phone.sb-lt .status-time{color:#fff}
.phone.sb-lt .status-icons svg [fill="#1D1F20"]{fill:#fff}
.phone.sb-lt .status-icons svg [stroke="#1D1F20"]{stroke:#fff}
.pane.up{transform:translateY(100%);pointer-events:none}
.pane.pk{z-index:16}
.pane.pk.left{z-index:9}
.sheet .cta2{margin-top:16px}

.s-body h1.tight{padding-bottom:8px}
.s-info{display:flex;align-items:center;gap:4px;margin:0 0 30px;font-size:12px;font-weight:500;color:#888F95;letter-spacing:-0.24px;line-height:1.3}
.s-foot{padding:10px 20px 20px}
.li .tic{width:48px;height:48px;border-radius:50%;background:#E4EDFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li.sel .tic{background:#fff}
.li .tic img{width:40px;height:40px;display:block}
.li .logo img{width:40px;height:40px;display:block;border-radius:50%}
.cta2:disabled{background:#E3E5E8;color:#B9BEC3;cursor:default;transform:none}
.cta2 svg{margin-right:6px;flex-shrink:0}
.ctx .lg{width:20px;height:20px;border-radius:50%;display:block}

/* 입력 정보 확인 */
.dpane{background:#fff}
.dpane .hbar .rst{margin-left:auto;border:none;background:none;padding:6px 0 6px 12px;font-size:15px;font-weight:700;color:#1F69FF;letter-spacing:-0.3px}
.dbody{position:absolute;top:100px;left:0;right:0;bottom:96px;overflow-y:auto}
.dfoot{position:absolute;left:0;right:0;bottom:0;padding:0 20px 20px;background:#fff}
.lcard{margin:13px 20px 0;height:80px;border-radius:10px;background:#EEF4FF;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px}
.lcard .th{width:58px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.lcard .th img{max-width:100%;max-height:100%;display:block;mix-blend-mode:multiply}
.lcard .tx{flex:1;min-width:0}
.lcard .tx b{display:block;font-size:16px;font-weight:700;color:#383B3E;letter-spacing:-0.32px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .tx span{display:block;margin-top:3px;font-size:13px;font-weight:500;color:#888F95;letter-spacing:-0.26px;white-space:nowrap}
.lcard .chg{flex-shrink:0;height:30px;padding:0 11px;border:none;border-radius:4px;background:#fff;font-size:13px;font-weight:700;color:#383B3E;letter-spacing:-0.26px}
.dot{color:#C0C4C8;margin:0 1px}
.band{height:8px;background:#F6F7F8;margin-top:22px}
.dsec{padding:12px 20px 0}
.dsec.l{padding-top:33px}
.dsec h2{font-size:17px;font-weight:700;color:#1D1F20;letter-spacing:-0.34px;line-height:22px;margin-bottom:12px}
.scard{border:1px solid #EBEDEF;border-radius:12px;padding:0 16px;background:#fff}
.srow2{display:flex;align-items:center;width:100%;height:57px;border:none;border-bottom:1px solid #EBEDEF;background:none;text-align:left;padding:0}
.srow2:last-child{border-bottom:none}
.srow2 .l{width:84px;flex-shrink:0;font-size:13px;font-weight:500;color:#6D7379;letter-spacing:-0.26px}
.srow2 .v{flex:1;text-align:right;font-size:16px;font-weight:700;color:#383B3E;letter-spacing:-0.32px}
.srow2 .v.lock{color:#6D7379}
.srow2 .c{width:16px;height:20px;margin-left:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dnote{margin-top:16px;font-size:13px;font-weight:500;color:#888F95;letter-spacing:-0.26px;line-height:1.35}
.dnote b{display:block;font-weight:700;color:#464A4E}

/* 불러오기 선택 */
.pkc{display:flex;align-items:center;gap:12px;width:100%;height:98px;padding:16px;margin-bottom:8px;border:1px solid #EBEDEF;border-radius:10px;background:#fff;text-align:left;transition:background .08s ease}
.pkc:active{background:var(--gray-03)}
.pkc.sel{border-color:#1F69FF;background:#EEF4FF}
.pkc .th{width:64px;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pkc .th img{max-width:100%;max-height:100%;display:block;mix-blend-mode:multiply}
.pkc .tx{flex:1;min-width:0}
.pkc .tg{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:#F1F2F4;color:#6D7379;font-size:12px;font-weight:700;letter-spacing:-0.24px}
.pkc .tt{display:block;margin-top:2px;font-size:16px;font-weight:700;color:#383B3E;letter-spacing:-0.32px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkc .sb{display:block;margin-top:2px;font-size:12px;font-weight:500;color:#A0A6AC;letter-spacing:-0.24px;white-space:nowrap}
.pk-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:96px;text-align:center}
.pk-empty .ic{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(31,105,255,.16),inset 0 0 0 1px #EEF2FA;display:flex;align-items:center;justify-content:center}
.pk-empty b{margin-top:24px;font-size:16px;font-weight:700;color:#383B3E;letter-spacing:-0.32px}
.pk-empty span{margin-top:6px;font-size:13px;font-weight:500;color:#A0A6AC;letter-spacing:-0.26px}

/* 결과 (파랑 헤더) */
.rs{background:#fff}
.rtb{position:absolute;top:0;left:0;right:0;height:100px;padding-top:44px;background:#1F69FF;z-index:20;display:flex;align-items:center;gap:8px;padding-left:16px}
.rtb .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:none;flex-shrink:0}
.rtb .title{font-weight:700;font-size:18px;letter-spacing:-0.36px;color:#fff;line-height:1.3}
.rscroll{position:absolute;inset:0;overflow-y:auto;padding:0 0 170px;-webkit-overflow-scrolling:touch}
.rtop{position:relative;height:193px;background:#1F69FF;padding:113px 20px 0}
.rtop .tags{display:flex;gap:4px;align-items:center}
.rtop .t1{display:flex;align-items:center;height:22px;padding:2px 8px;border-radius:6px;background:#fff;color:#1F69FF;font-size:13px;font-weight:700;letter-spacing:-0.26px}
.rtop .t2{display:flex;align-items:center;height:22px;padding:2px 6px;border-radius:6px;background:#F1F2F4;color:#6D7379;font-size:12px;font-weight:700;letter-spacing:-0.24px}
.rtop h1{margin-top:8px;font-size:26px;font-weight:700;color:#fff;letter-spacing:-0.52px;line-height:1.3}
.pcw{background:#1F69FF;padding:0 20px 36px}
.pc{background:#fff;border-radius:12px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.rtr{position:absolute;top:0;left:0;display:block;z-index:3;pointer-events:none;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .5s ease .1s,transform .6s cubic-bezier(.22,1,.36,1) .1s}
.rs.go .rtr{opacity:1;transform:none}
.rbody{padding:17px 20px 0;display:flex;flex-direction:column;gap:12px}
</style>
</head>

  function openDirect(step){
    var max = step === 'maker' ? 20 : 50;
    openSheet('<h3>' + (step === 'maker' ? '장비 업체명' : '장비 모델명') + '</h3>' +
      '<input class="inp" id="dIn" maxlength="' + max + '" placeholder="' + (step === 'maker' ? '장비 업체명을 입력하세요' : '장비 모델명을 입력하세요') + '" autocomplete="off"/>' +
      '<button class="cta2" id="dCta" data-act="direct-ok" disabled>' + (step === 'maker' ? '입력한 장비로 선택하기' : '입력한 장비 모델명 선택하기') + '</button>');
    setTimeout(function(){ var i = $('dIn'); if(i) i.focus(); }, 320);
  }

  /* ───────── 흐름 ───────── */
  function startMain(){
    S = blank(); D = null; mode = 'direct'; stack = [{ k:'entry' }];
    pushDesc({ k:'step', flow:'main', i:0 }, 'push');
  }
  function startEdit(fk){
    if(mode === 'load' && fk !== 'editHours') return;
    D = clone(S);
    pushDesc({ k:'step', flow:fk, i:0 }, 'push');
  }
  function openPick(from){
    var pane = stack.some(function(x){ return x.pane === 'pk'; }) ? 'pk2' : 'pk';
    pushDesc({ k:'pick', from:from, pane:pane, sel: from === 'done' ? S.savedIdx : -1 }, 'modal');
  }
  function applySaved(i){
    var e = SAVED()[i];
    S = { type:e.type, maker:e.maker, model:e.model, year:e.year, hours:e.hours, alias:e.alias, img:e.img, savedIdx:i };
  }
  function finishFlow(f){
    if(!f.draft) pushDesc({ k:'done' }, 'push'); else commitEdit();
  }
  function stepNext(d){
    var f = FL[d.flow];
    if(d.i + 1 < f.steps.length) pushDesc({ k:'step', flow:d.flow, i:d.i + 1 }, 'push'); else finishFlow(f);
  }
  function startLoading(){
    clearTimeout(loadTimer);
    pushDesc({ k:'load' }, 'push');
    loadTimer = setTimeout(function(){
      if(cur !== 'load') return;
      stack.pop(); var rd = { k:'res' }; stack.push(rd); go(rd, 'push');
      setTimeout(runRes, 380);
    }, 2600);
  }
  function doPick(v){
    var d = top(), f = FL[d.flow], step = f.steps[d.i], dat = dataOf(f);
    if(step === 'type'){
      if(v !== dat.type){ dat.type = v; dat.maker = dat.model = dat.year = dat.hours = null; }
      else if(f.draft){ cancelEdit(); return; }
    } else if(step === 'maker'){
      if(v !== dat.maker){ dat.maker = v; dat.model = null; }
    } else if(step === 'model'){ dat.model = v; }
    else if(step === 'year'){ dat.year = parseInt(v, 10); }
    var pane = $(cur);
    Array.prototype.forEach.call(pane.querySelectorAll('[data-act="pick"]'), function(b){ b.classList.toggle('sel', b.getAttribute('data-v') === String(v)); });
    if(f.cta[step]){ var c = P('#sCta'); if(c) c.disabled = false; }
    else setTimeout(function(){ if(top() === d) stepNext(d); }, 150);
  }

  /* ───────── 이벤트 ───────── */
  phone.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if(!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    switch(act){
      case 'en-back': toast('홈으로 이동해요'); break;
      case 'en-direct': startMain(); break;
      case 'en-load': openPick('entry'); break;
      case 'back': popNav(); break;
      case 'restart': resetAll(true); break;
      case 'pick': doPick(v); break;
      case 'direct': openDirect(el.getAttribute('data-step')); break;
      case 'direct-ok': {
        var val = ($('dIn').value || '').trim(); if(!val) break;
        closeSheet(); doPick(val); break;
      }
      case 'scta': {
        if(el.disabled) break;
        var d = top(), f = FL[d.flow], step = f.steps[d.i], dat = dataOf(f);
        if(step === 'hours'){
          var n = parseFloat((P('#hoursIn').value || '').replace(/,/g, '')); if(!(n > 0)) break; dat.hours = n;
        }
        if(!stepValid(step, dat)) break;
        stepNext(d); break;
      }
      case 'edit': startEdit(el.getAttribute('data-f')); break;
      case 'done-cta': if(mode === 'load') startLoading(); else openReg(); break;
      case 'chg': openPick('done'); break;
      case 'pk-sel': {
        var pd = top(); pd.sel = parseInt(el.getAttribute('data-i'), 10);
        Array.prototype.forEach.call($(cur).querySelectorAll('.pkc'), function(b, i){ b.classList.toggle('sel', i === pd.sel); });
        var can = pd.from === 'entry' || pd.sel !== S.savedIdx; P('#pkCta').disabled = !can; break;
      }
      case 'pk-ok': {
        var pd2 = top(); if(el.disabled || pd2.sel < 0) break;
        applySaved(pd2.sel);
        if(pd2.from === 'done'){ stack.pop(); go(top(), 'dismiss'); }
        else { mode = 'load'; pushDesc({ k:'done' }, 'push'); }
        break;
      }
      case 'pk-direct': {
        S = blank(); D = null; mode = 'direct'; stack = [{ k:'entry' }];
        stack.push({ k:'step', flow:'main', i:0 }); go(top(), 'push'); break;
      }
      case 'reg-ok': registered = true; closeSheet(); setTimeout(startLoading, 220); break;
      case 'reg-skip': registered = false; closeSheet(); setTimeout(startLoading, 220); break;
      case 'res-toggle': $('ic').classList.toggle('closed'); break;
      case 'res-cta': toast('대리점 견적 요청 화면으로 이동해요'); break;
      case 'res-skip': toast('홈으로 이동해요'); break;
      case 'sheet-close': closeSheet(); break;
    }
  });

  phone.addEventListener('input', function(e){
    var t = e.target;
    if(t.id === 'q'){
      q = t.value; var d = top(), f = FL[d.flow];
      P('#listBox').innerHTML = listHTML(f.steps[d.i], dataOf(f));
    }
    else if(t.id === 'dIn'){ $('dCta').disabled = !t.value.trim(); }
    else if(t.id === 'hoursIn'){
      var raw = t.value.replace(/[^0-9.]/g, ''), parts = raw.split('.'), err = '';
      var ip = parts[0].replace(/^0+(?=\d)/, ''), dp = parts.length > 1 ? parts.slice(1).join('') : null;
      if(dp !== null && dp.length > 1){ dp = dp.slice(0, 1); err = '소수점 이하 1자리까지 입력 가능해요.'; }
      var num = parseFloat((ip || '0') + (dp !== null ? '.' + (dp || '0') : ''));
      if(num > 999999.9){ ip = '999999'; dp = '9'; err = '최대 999,999.9까지 입력 가능해요.'; }
      var shown = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (dp !== null ? '.' + dp : '');
      t.value = shown;
      P('#hErr').textContent = err;
      t.style.borderBottomColor = err ? 'var(--red)' : '';
      var val = parseFloat(shown.replace(/,/g, ''));
      P('#sCta').disabled = !(val > 0);
    }
  });
  phone.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      if(e.target.id === 'hoursIn' && !P('#sCta').disabled) P('#sCta').click();
      if(e.target.id === 'dIn' && !$('dCta').disabled) $('dCta').click();
    }
  });

  /* 데스크톱 컨트롤 */
  function sample(t){
    var m = { '트랙터':['LS엠트론','MT9.140-DCT'], '콤바인':['LS엠트론','V475'], '이앙기':['LS엠트론','LV63DR'] }[t];
    return { type:t, maker:m[0], model:m[1], year:2026, hours:1999.5, alias:null, img:null, savedIdx:-1 };
  }
  function jump(descs, newS, newMode){
    clearTimeout(loadTimer); closeSheet(); S = newS; D = null; mode = newMode; registered = false;
    stack = [{ k:'entry' }]; var last = null;
    descs.forEach(function(d){ stack.push(d); last = d; });
    go(last, 'push');
  }
  $('cReset').onclick = function(){ resetAll(false); };
  $('cDirect').onclick = function(){ resetAll(false); jump([{ k:'done' }], sample('트랙터'), 'direct'); };
  $('cLoad').onclick = function(){ resetAll(false); if(!hasSaved) return toast('등록 장비가 없는 상태예요'); applySaved(1); jump([{ k:'done' }], S, 'load'); };
  function quickRes(t){ resetAll(false); jump([{ k:'done' }, { k:'res' }], sample(t), 'direct'); setTimeout(runRes, 380); }
  $('cRes').onclick = function(){ quickRes('트랙터'); };
  $('cResC').onclick = function(){ quickRes('콤바인'); };
  $('cResR').onclick = function(){ quickRes('이앙기'); };
  $('cEmpty').onclick = function(){ hasSaved = !hasSaved; this.textContent = '등록 장비: ' + (hasSaved ? '있음' : '없음'); resetAll(false); };

  updateUI();
})();
</script>
</body>
</html>
